# Defaults for vps-init-hardening. Override with ./start.sh --config FILE.

NEW_ADMIN_USER="deployer"
SSH_PORT="22"
FIREWALL_MODE="safe"

INSTALL_BASIC_TOOLS="yes"
INSTALL_DOCKER="no"
INSTALL_DOKPLOY="no"
INSTALL_CLOUDFLARED="no"

# Full Hardening Suite Modules (CIS Benchmark Level 1/2)
ENABLE_SYSCTL_HARDENING="yes"
ENABLE_SECURITY_UPDATES="yes"
ENABLE_AUDITD="yes"
ENABLE_SYSTEM_HARDENING="yes"
ENABLE_TIMESYNC="yes"
DOCKER_UFW_FIX="yes"
ADD_USER_TO_DOCKER_GROUP="yes"
DOKPLOY_PORT="3000"

# Non-interactive mode requires root SSH keys to already exist unless this is set
# to a readable public key file path.
SSH_PUBLIC_KEY_FILE=""

# Cloudflare tunnel token is intentionally not stored here. Use:
# CLOUDFLARED_TOKEN='...' sudo -E bash start.sh --yes --install-cloudflared

STATE_DIR="/var/lib/vps-init-hardening"
SYSTEM_BACKUP_DIR="/var/backups/vps-init-hardening"
LOG_DIR="/var/log/vps-init-hardening"
